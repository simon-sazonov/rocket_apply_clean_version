# experience.yaml — the FIXED experience block. Every entry and every bullet prints
# on every CV, in this order. Tailoring happens only through `variants`: pre-approved
# rewordings the selector may swap in for a given role family. It never writes new text.
#
# EXAMPLE DATA for a made-up person. Replace with your own.
#
# Rules (checked by `make validate-profile`):
#   * Bullet text is a plain double-quoted single-line string. What is between the
#     quotes is exactly what prints.
#   * `rendered_lines` is how many lines the bullet takes on the CV. The validator
#     tells you the right number if you get it wrong.
#   * A variant must take the SAME number of lines as its bullet (line-neutral),
#     or the one-page CV would overflow.
#   * Every bullet needs at least 3 tags from taxonomy.yaml.
#   * The number of entries and bullets per entry is declared in layout.yaml
#     (sections -> experience -> entries). Keep the two in step.

- id: northwind
  type: experience
  org: Northwind Analytics
  role: Data Science Intern
  employment_type: Internship
  location: Manchester, United Kingdom
  start: 2026-06
  end: 2026-09
  context: >
    Summer internship in a six-person analytics team at a retail-analytics
    consultancy. Worked on demand forecasting features and on the model-monitoring
    report the team sent to clients every month.
  bullets:
    - id: northwind.b1
      text: "Built a gradient-boosted demand model on two years of store-level sales, adding holiday and promotion features that cut weekly forecast error 18% against the existing baseline"
      rendered_lines: 2
      tags: [python, machine_learning, gradient_boosting, feature_engineering, time_series, model_evaluation]
      metrics: [m.northwind.error]
      strength: strong
      use_for: [data_science, machine_learning, analytics]
      never_use_for: []
      variants:
        - id: northwind.b1.v2
          use_for: [machine_learning]
          text: "Trained a gradient-boosted demand model on two years of store-level sales, engineering holiday and promotion features that cut weekly forecast error 18% against baseline"

    - id: northwind.b2
      text: "Automated the monthly model-monitoring report in Python, replacing a manual spreadsheet"
      rendered_lines: 1
      tags: [python, monitoring, data_pipelines, pandas]
      metrics: []
      strength: medium
      use_for: [data_engineering, data_science, analytics]
      never_use_for: []
      variants: []

    - id: northwind.b3
      text: "Presented findings to client analysts and wrote the handover notes for the next intern"
      rendered_lines: 1
      tags: [communication, stakeholder_management, documentation]
      metrics: []
      strength: supporting
      use_for: [analytics, data_science]
      never_use_for: []
      variants: []

