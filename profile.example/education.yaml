# education.yaml — the FIXED education block. Prints the same on every CV.
# `tags` are not printed; they let the matcher find real support for a
# requirement (a posting asking for statistics finds your statistics module).
#
# EXAMPLE DATA for a made-up person. Replace with your own.
# Ids must be unique and match ^[a-z0-9_.]+$ ; skills may cite `edu.*` ids as evidence.

