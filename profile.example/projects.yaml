# projects.yaml — THE VARIABLE SLOT. RocketApply picks the 3 projects that best fit
# each job and prints only those.
#
# EXAMPLE DATA for a made-up person. Replace with your own projects.
#
# Shape rules (checked by `make validate-profile`):
#   - at least 8 projects, so there is a real choice per job
#   - exactly 2 bullets per project
#   - every bullet 55-95 characters, so each project costs exactly 3 lines on the CV
#   - project name + link label <= 90 characters
#   - every bullet needs at least 3 tags from taxonomy.yaml
#
# readme_state: ok | stub | none. For stub/none the CV keeps the project but drops
# the "GitHub" link label: a linked repo with an empty README reads as abandoned.
#
# conflicts_with: experience bullet ids describing the same work. The selector will
# never print both on one page.

- id: proj.forecast
  type: project
  name: "Retail Demand Forecasting Benchmark"
  link_label: GitHub
  url: https://github.com/your-handle/demand-forecasting
  readme_state: ok
  context_type: personal
  period: 2026-03/2026-05
  team_size: 1
  stack: [Python, pandas, LightGBM, statsmodels]
  themes: [forecasting, model_evaluation]
  summary: >
    Compared seasonal-naive, ARIMA and gradient-boosted models on a public retail
    dataset with a rolling-origin evaluation.
  strength: strong
  use_for: [data_science, machine_learning, analytics]
  bullets:
    - id: proj.forecast.b1
      text: "Benchmarked naive, ARIMA and gradient-boosted forecasts with rolling-origin validation"
      tags: [forecasting, time_series, model_evaluation, benchmarking]
      metrics: []
    - id: proj.forecast.b2
      text: "Boosted model cut MASE from 1.00 to 0.82; wrote up where it still loses to naive"
      tags: [gradient_boosting, model_evaluation, documentation]
      metrics: [m.forecast.mase]

