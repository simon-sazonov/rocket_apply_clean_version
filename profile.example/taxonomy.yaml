# taxonomy.yaml — the canonical tag vocabulary.
#
# Tags are how RocketApply matches your experience to a job posting. Matching
# works on exact strings, so every tag used anywhere in profile/ must appear
# below (the validator rejects anything that does not).
#
# Tags that none of your bullets use are still worth keeping: they let a POSTING
# that names that thing resolve to something. Add your own tags freely — just add
# them here first.

aliases:
  # left-hand side is REJECTED, right-hand side is canonical
  ML: machine_learning
  machine learning: machine_learning
  deep learning: deep_learning
  RL: reinforcement_learning
  time series: time_series
